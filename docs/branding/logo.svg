<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff4fa3"/><stop offset="0.42" stop-color="#a23dff"/><stop offset="1" stop-color="#2a6bff"/>
  </linearGradient>
  <radialGradient id="bgGlow" cx="0.3" cy="0.12" r="0.7">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glassDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a1a6b" stop-opacity="0.78"/><stop offset="1" stop-color="#140b3f" stop-opacity="0.82"/>
  </linearGradient>
  <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4a5bff" stop-opacity="0.72"/><stop offset="1" stop-color="#7a3cff" stop-opacity="0.78"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd1ef"/><stop offset="0.5" stop-color="#b99cff"/><stop offset="1" stop-color="#7fb4ff"/>
  </linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset="1" stop-color="#f5b335"/></linearGradient>
  <radialGradient id="sun" cx="0.4" cy="0.35" r="0.8"><stop offset="0" stop-color="#fff6b0"/><stop offset="0.6" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff9d1c"/></radialGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7e2ff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1fd16b"/><stop offset="1" stop-color="#8dffb8"/></linearGradient>
  <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#2a63ff"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="0.5" stop-color="#aab1c6"/><stop offset="1" stop-color="#e3e7f2"/></linearGradient>
  <filter id="glow" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowGreen" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowBlue" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b0230" flood-opacity="0.45"/></filter>
  <mask id="moonA"><rect x="150" y="440" width="120" height="100" fill="#000"/><circle cx="208" cy="490" r="40" fill="#fff"/><circle cx="226" cy="482" r="34" fill="#000"/></mask>
