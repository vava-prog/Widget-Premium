  <rect x="122" y="690" width="780" height="72" rx="44" fill="url(#gloss)"/>
  <line x1="381" y1="716" x2="381" y2="872" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <line x1="643" y1="716" x2="643" y2="872" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
