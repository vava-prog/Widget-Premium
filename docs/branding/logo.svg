      <line x1="623" y1="480" x2="641" y2="480"/><line x1="729" y1="480" x2="747" y2="480"/>
      <line x1="641" y1="436" x2="653" y2="448"/><line x1="717" y1="436" x2="729" y2="448"/>
      <line x1="641" y1="524" x2="653" y2="512"/>
    </g>
    <circle cx="685" cy="480" r="62" fill="url(#sun)"/>
  </g>
  <g filter="url(#shadow)">
    <circle cx="745" cy="560" r="44" fill="url(#cloud)"/>
    <circle cx="803" cy="545" r="58" fill="url(#cloud)"/>
    <circle cx="858" cy="565" r="40" fill="url(#cloud)"/>
    <rect x="745" y="560" width="113" height="45" fill="url(#cloud)"/>
    <circle cx="745" cy="582" r="22" fill="url(#cloud)"/>
    <circle cx="858" cy="582" r="22" fill="url(#cloud)"/>
  </g>

  <!-- Thông số máy -->
