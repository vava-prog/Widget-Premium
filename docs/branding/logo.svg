  <g mask="url(#moonB)"><circle cx="402" cy="490" r="40" fill="url(#gold)"/></g>
  <!-- ngày -->
  <text x="208" y="602" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="88" fill="#fff">12</text>
  <text x="402" y="602" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="88" fill="#fff">20</text>
  <!-- hoa sen -->
  <g transform="translate(305 508) scale(0.72)" filter="url(#glowSoft)">
    <ellipse cx="-22" cy="0" rx="10" ry="24" transform="rotate(-50 -22 14)" fill="#ff9cc9"/>
    <ellipse cx="22" cy="0" rx="10" ry="24" transform="rotate(50 22 14)" fill="#ff9cc9"/>
    <ellipse cx="-11" cy="-4" rx="11" ry="27" transform="rotate(-22 -11 14)" fill="#ffb8da"/>
    <ellipse cx="11" cy="-4" rx="11" ry="27" transform="rotate(22 11 14)" fill="#ffb8da"/>
    <ellipse cx="0" cy="-8" rx="11" ry="30" fill="#ffd3e8"/>
  </g>

  <!-- Thời tiết -->
  <rect x="524" y="362" width="390" height="286" rx="52" fill="url(#glassBlue)" stroke="url(#edge)" stroke-width="7"/>
  <rect x="534" y="372" width="370" height="70" rx="40" fill="url(#gloss)"/>
  <g filter="url(#glowGold)">
