<rect width="1024" height="1024" rx="224" fill="url(#bg)"/><rect width="1024" height="1024" rx="224" fill="url(#bgGlow)"/>
  <!-- Đồng hồ -->
  <rect x="110" y="120" width="804" height="210" rx="58" fill="url(#glassDark)" stroke="url(#edge)" stroke-width="7"/>
  <rect x="122" y="130" width="780" height="80" rx="46" fill="url(#gloss)"/>
  <text x="512" y="283" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="158" fill="#fff" letter-spacing="2" filter="url(#glow)">10:09</text>

  <!-- Lịch âm dương -->
  <rect x="110" y="362" width="390" height="286" rx="52" fill="url(#glassDark)" stroke="url(#edge)" stroke-width="7"/>
  <rect x="120" y="372" width="370" height="70" rx="40" fill="url(#gloss)"/>
