    <rect x="306" y="748" width="12" height="24" rx="4" fill="#7dffb0"/>
    <rect x="202" y="740" width="78" height="40" rx="7" fill="url(#green)"/>
  </g>
  <text x="246" y="862" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="54" fill="#fff">87%</text>
  <!-- chip RAM -->
