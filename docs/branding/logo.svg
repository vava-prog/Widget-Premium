    <g stroke="#9ad0ff" stroke-width="7" stroke-linecap="round">
      <line x1="486" y1="718" x2="486" y2="736"/><line x1="512" y1="718" x2="512" y2="736"/><line x1="538" y1="718" x2="538" y2="736"/>
      <line x1="486" y1="784" x2="486" y2="802"/><line x1="512" y1="784" x2="512" y2="802"/><line x1="538" y1="784" x2="538" y2="802"/>
      <line x1="466" y1="738" x2="484" y2="738"/><line x1="466" y1="760" x2="484" y2="760"/>
      <line x1="540" y1="738" x2="558" y2="738"/><line x1="540" y1="760" x2="558" y2="760"/>
    </g>
    <rect x="474" y="730" width="76" height="62" rx="12" fill="url(#chip)" stroke="#cfe6ff" stroke-width="4"/>
    <rect x="496" y="749" width="32" height="24" rx="5" fill="#0d2a66" fill-opacity="0.7"/>
